```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Closed</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #050914;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Dark premium background */
.bg {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 20%, rgba(0, 153, 255, 0.20), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(0, 81, 255, 0.12), transparent 30%),
        #050914;
}

/* Popup */
.popup {
    position: relative;
    width: calc(100% - 32px);
    max-width: 430px;
    padding: 34px 24px 28px;
    text-align: center;
    border-radius: 28px;

    background: linear-gradient(
        145deg,
        rgba(20, 31, 55, 0.98),
        rgba(7, 13, 27, 0.99)
    );

    border: 1px solid rgba(0, 183, 255, 0.35);

    box-shadow:
        0 0 25px rgba(0, 153, 255, 0.15),
        0 25px 80px rgba(0, 0, 0, 0.65);

    animation: popupIn 0.5s ease;
}

@keyframes popupIn {
    from {
        opacity: 0;
        transform: scale(0.88) translateY(20px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* Top icon */
.icon {
    width: 82px;
    height: 82px;
    margin: 0 auto 20px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 42px;

    background: linear-gradient(145deg, #00b7ff, #005cff);
    box-shadow:
        0 0 25px rgba(0, 174, 255, 0.45),
        inset 0 0 15px rgba(255,255,255,0.18);
}

/* Closed text */
.closed {
    font-size: 27px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
}

.message {
    color: #aebbd0;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 22px;
}

/* New app box */
.new-app {
    padding: 17px 14px;
    margin-bottom: 22px;
    border-radius: 17px;

    background: linear-gradient(
        135deg,
        rgba(0, 153, 255, 0.13),
        rgba(0, 76, 255, 0.08)
    );

    border: 1px solid rgba(0, 174, 255, 0.25);
}

.new-label {
    color: #8292aa;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 7px;
}

.app-name {
    color: #ffffff;
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 0.8px;
}

.app-name span {
    color: #00b7ff;
}

/* Button */
.open-btn {
    width: 100%;
    border: none;
    outline: none;
    padding: 17px 20px;

    border-radius: 15px;

    background: linear-gradient(135deg, #00b7ff, #0066ff);

    color: #ffffff;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.4px;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(0, 119, 255, 0.28);

    transition: 0.2s ease;
}

.open-btn:active {
    transform: scale(0.97);
    box-shadow: 0 5px 15px rgba(0, 119, 255, 0.22);
}

/* Telegram username */
.telegram {
    margin-top: 15px;
    color: #687990;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="popup">

    <div class="icon">🐶</div>

    <div class="closed">
        THIS APP IS CLOSED
    </div>

    <div class="message">
        This app is no longer available.<br>
        But don't worry — our new app is now launched!
    </div>

    <div class="new-app">
        <div class="new-label">
            OUR NEW APP
        </div>

        <div class="app-name">
            BABYDOGE <span>TAYCON</span>
        </div>
    </div>

    <button class="open-btn" onclick="openNewApp()">
        🚀 OPEN NEW APP
    </button>

    <div class="telegram">
        @Crypto_Tycon_Bot
    </div>

</div>

<script>
function openNewApp() {
    window.location.href = "https://t.me/Crypto_Tycon_Bot";
}
</script>

</body>
</html>
```
