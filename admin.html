<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZON OF INSTA · Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4fa;color:#211729;font-family:system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:24px}.brand{font-size:25px;font-weight:950;background:linear-gradient(90deg,#7028df,#ed168e,#ff7a18);background-clip:text;color:transparent}.box{background:white;border:1px solid #eee5f1;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 25px #28103208}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat b{font-size:27px;display:block}.stat span{color:#817787;font-size:12px}.input,textarea{padding:12px;border:1px solid #e5dce9;border-radius:10px;width:100%;margin:7px 0 12px}.btn{padding:10px 14px;border:0;border-radius:10px;background:linear-gradient(90deg,#7028df,#ed168e);color:white;font-weight:800;margin:3px}.btn.gray{background:#eee8f2;color:#4b3c51}.btn.red{background:#c92e55}.btn.green{background:#16884c}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:13px;vertical-align:top}th{color:#786d7f;background:#fcfaff}.pill{font-size:10px;text-transform:uppercase;font-weight:900;padding:5px 8px;border-radius:20px;background:#fff0d5;color:#986500}.pill.completed{background:#e6f8ed;color:#168447}.pill.rejected{background:#ffe8ed;color:#bd2345}.muted{color:#817787;font-size:12px}@media(max-width:600px){.wrap{padding:14px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}}
</style></head><body><main class="wrap"><div class="brand">ZON OF INSTA · ADMIN</div><p class="muted">Promotion request management dashboard</p>
<div id="login" class="box" style="max-width:420px"><h2>Admin login</h2><input class="input" id="password" type="password" placeholder="Admin password"><button class="btn" onclick="login()">LOGIN</button><p id="loginError" class="muted"></p></div>
<div id="dashboard" style="display:none"><div class="stats"><div class="box stat"><span>TOTAL USERS</span><b id="users">0</b></div><div class="box stat"><span>TOTAL REQUESTS</span><b id="requests">0</b></div><div class="box stat"><span>PENDING</span><b id="pending">0</b></div></div>
<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>All requests</h2><button class="btn gray" onclick="load()">REFRESH</button></div><div class="tablewrap"><table><thead><tr><th>ID / Date</th><th>User</th><th>Credits</th><th>Instagram Reel</th><th>Status</th><th>Admin action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
</main><script>
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{...opts,credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({error:'Server error'}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('login').style.display='none';$('dashboard').style.display='block';await load()}catch(e){$('loginError').textContent=e.message}}
async function load(){try{const [s,r]=await Promise.all([api('/api/admin/summary'),api('/api/admin/requests')]);$('users').textContent=s.users;$('requests').textContent=s.requests;$('pending').textContent=s.pending;$('rows').innerHTML=r.requests.map(x=>`<tr><td>#${x.id}<br><span class="muted">${new Date(x.created_at).toLocaleString()}</span></td><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.email)}</span></td><td>${Number(x.amount).toLocaleString('en-IN')}</td><td><a href="${esc(x.reel_url)}" target="_blank" rel="noopener">Open Reel ↗</a></td><td><span class="pill ${x.status}">${x.status}</span>${x.admin_note?'<br><span class="muted">'+esc(x.admin_note)+'</span>':''}</td><td>${x.status==='pending'?`<textarea id="note${x.id}" placeholder="Optional admin note"></textarea><button class="btn green" onclick="update(${x.id},'completed')">COMPLETE</button><button class="btn red" onclick="update(${x.id},'rejected')">REJECT + REFUND</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">No requests yet.</td></tr>'}catch(e){throw e}}
async function update(id,status){if(!confirm(status==='rejected'?'Reject this request and refund credits to the user?':'Mark this request as completed?'))return;try{const note=$('note'+id)?.value||'';const d=await api('/api/admin/requests/'+id,{method:'PUT',body:JSON.stringify({status,note})});alert(status==='rejected'?`Rejected. ${d.refunded} credits refunded.`:'Request marked completed.');await load()}catch(e){alert(e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{try{await load();$('login').style.display='none';$('dashboard').style.display='block'}catch{}})();
</script></body></html>
